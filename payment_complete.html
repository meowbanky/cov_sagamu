<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payment Complete — COV Coop</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center;
         justify-content: center; padding: 24px; background: #f7f7f8;
         font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         color: #1a1a1a; }
  .card { background: #fff; border-radius: 16px; padding: 32px 28px;
          max-width: 380px; width: 100%; text-align: center;
          box-shadow: 0 2px 16px rgba(0,0,0,.08); }
  .tick { width: 64px; height: 64px; border-radius: 50%; background: #e8f5e9;
          display: flex; align-items: center; justify-content: center;
          margin: 0 auto 20px; font-size: 32px; color: #2e7d32; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: #555; margin: 0 0 8px; }
  .hint { margin-top: 20px; padding-top: 16px; border-top: 1px solid #eee;
          font-size: 14px; color: #777; }
</style>
</head>
<body>
  <div class="card">
    <div class="tick">&#10003;</div>
    <h1>Payment complete</h1>
    <p>Thank you. Your payment is being confirmed with your cooperative account.</p>
    <p class="hint">
      You can now close this window and return to the COV Coop app, where your
      payment status will be shown.
    </p>
  </div>
</body>
</html>
